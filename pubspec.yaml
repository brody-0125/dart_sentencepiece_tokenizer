name: dart_sentencepiece_tokenizer
description: A lightweight pure Dart SentencePiece tokenizer supporting BPE (Gemma), Unigram (Llama), and Hugging Face tokenizer.json pipelines.
version: 1.4.1
repository: https://github.com/brody-0125/dart_sentencepiece_tokenizer
issue_tracker: https://github.com/brody-0125/dart_sentencepiece_tokenizer/issues
topics:
  - nlp
  - sentencepiece
  - tokenizer
  - machine-learning
  - llm

environment:
  sdk: ^3.10.7

dependencies:
  # No external dependencies - pure Dart implementation

dev_dependencies:
  crypto: ^3.0.7
  lints: ^6.0.0
  test: ^1.25.6
