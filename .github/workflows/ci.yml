name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ["3.10.7", "3.10.9", "3.11.6", "3.12.2", "3.13.2", stable]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart test

  huggingface-fixtures:
    name: Hugging Face Fixtures (network)
    runs-on: ubuntu-latest
    # SigLIP2 and Gemma fixtures intentionally expose the pending Split
    # parser contribution. Remove this once that support is merged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"
      - run: dart pub get
      - run: dart test test/huggingface_network_test.dart
        env:
          RUN_HF_NETWORK_TESTS: "1"
